        with:
          name: sbill-ios-build
          path: build/ios/iphoneos/
      - name: Package iOS unsigned app
        shell: bash
        run: |
          IOS_APP=$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$IOS_APP"
          ditto -c -k --sequesterRsrc --keepParent "$IOS_APP" sbill-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-ios-package
          path: sbill-ios-unsigned.zip

  release-gate:
    if: always()
    needs: [quality, android, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Validate release jobs
        shell: bash
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "android=${{ needs.android.result }}"
          echo "windows=${{ needs.windows.result }}"
          echo "macos=${{ needs.macos.result }}"
          echo "ios=${{ needs.ios.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.macos.result }}" = "success"
          test "${{ needs.ios.result }}" = "success"
