name: SBILL CI
# Final production validation workflow for every main commit.
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]


env:
  FLUTTER_VERSION: 3.47.6
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format .
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter create --platforms=android,windows,macos .
      - name: Generate launcher icon PNG
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import math

          SCALE = 4
          N = 1024
          W = N * SCALE

          image = Image.new("RGBA", (W, W), (0, 0, 0, 0))
          draw = ImageDraw.Draw(image)

          def lerp(a, b, t):
              return a + (b - a) * t

          def cubic(p0, p1, p2, p3, t):
              u = 1 - t
              return (
                  u**3 * p0
                  + 3 * u**2 * t * p1
                  + 3 * u * t**2 * p2
                  + t**3 * p3
              )

          def point_cubic(a, b, c, d, t):
              return (cubic(a[0], b[0], c[0], d[0], t),
                      cubic(a[1], b[1], c[1], d[1], t))

          # Canonical SBILL launcher geometry.
          path = [
              ((710, 285), (640, 212), (526, 180), (407, 207)),
              ((407, 207), (286, 234), (213, 303), (213, 395)),
              ((213, 395), (213, 501), (287, 546), (418, 582)),
              ((418, 582), (552, 618), (617, 642), (617, 703)),
              ((617, 703), (617, 763), (556, 804), (463, 804)),
          ]
          points = []
          for seg in path:
              start = point_cubic(*seg, 0.0)
              if not points:
                  points.append(start)
              for i in range(1, 81):
                  points.append(point_cubic(*seg, i / 80))
          # Final straight-ish cubic continuation from the canonical path.
          final = ((463, 804), (380, 804), (313, 775), (256, 686))
          for i in range(1, 81):
              points.append(point_cubic(*final, i / 80))

          margin = 32 * SCALE
          radius = 220 * SCALE
          rect = (margin, margin, W - margin, W - margin)

          # Diagonal blue gradient matching the web/app logo.
          start = (37, 99, 235)
          end = (29, 78, 216)
          for y in range(rect[1], rect[3] + 1):
              for x in range(rect[0], rect[2] + 1):
                  t = ((x - rect[0]) + (y - rect[1])) / max(1, 2 * (rect[2] - rect[0]))
                  t = max(0.0, min(1.0, t))
                  r = int(round(lerp(start[0], end[0], t)))
                  g = int(round(lerp(start[1], end[1], t)))
                  b = int(round(lerp(start[2], end[2], t)))
                  image.putpixel((x, y), (r, g, b, 255))

          # Rounded clipping mask for the blue square.
          mask = Image.new("L", (W, W), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle(rect, radius=radius, fill=255)
          image.putalpha(mask)

          # White S stroke.
          scaled_points = [(int(round(x * SCALE)), int(round(y * SCALE))) for x, y in points]
          draw = ImageDraw.Draw(image)
          draw.line(
              scaled_points,
              fill=(255, 255, 255, 255),
              width=86 * SCALE,
              joint="curve",
          )
          for x, y in (scaled_points[0], scaled_points[-1]):
              rr = (x - 43 * SCALE, y - 43 * SCALE, x + 43 * SCALE, y + 43 * SCALE)
              draw.ellipse(rr, fill=(255, 255, 255, 255))

          image = image.resize((N, N), Image.Resampling.LANCZOS)
          image.save("assets/icon/sbill_icon.png", "PNG", optimize=True)
          PY
      # Platform jobs own launcher generation; quality must not depend on platform icon assets.
      - run: test -s website/index.html
      - run: test -s website/styles.css


  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter create --platforms=android .
      - run: flutter build apk --debug --dart-define=SUPABASE_URL="${{ env.SUPABASE_URL }}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ env.SUPABASE_PUBLISHABLE_KEY }}"
      - run: flutter build apk --release --dart-define=SUPABASE_URL="${{ env.SUPABASE_URL }}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ env.SUPABASE_PUBLISHABLE_KEY }}"
      - name: Validate Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="build/app/outputs/flutter-apk/app-debug.apk"
          RELEASE_APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          "$ZIPALIGN" -c -v 4 "$DEBUG_APK"
          "$ZIPALIGN" -c -v 4 "$RELEASE_APK"
          if "$ZIPALIGN" -h 2>&1 | grep -q -- '-P'; then
            "$ZIPALIGN" -c -P 16 -v 4 "$DEBUG_APK"
            "$ZIPALIGN" -c -P 16 -v 4 "$RELEASE_APK"
          else
            echo "zipalign does not expose -P 16 on this runner; 16 KB profile check is unavailable."
          fi
          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

