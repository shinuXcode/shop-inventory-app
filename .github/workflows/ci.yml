      - name: Generate target launcher icons
        shell: bash
        run: |
          cat > flutter_launcher_icons_job.yaml <<'YAML'
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            macos:
              generate: false
            windows:
              generate: true
              icon_size: 256
            image_path: "assets/icon/sbill_icon.png"
            min_sdk_android: 21
          YAML
          dart run flutter_launcher_icons -f flutter_launcher_icons_job.yaml
      - run: flutter build windows --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sbill-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-windows-package
          path: sbill-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-windows-build
          path: build/windows/x64/runner/Release/

  macos:
