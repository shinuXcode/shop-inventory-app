name: SBILL CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: sbill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format .
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter create --platforms=android,windows,macos .
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: test -s website/index.html
      - run: test -s website/styles.css

  windows:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter create --platforms=windows .
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-windows-build
          path: build/windows/x64/runner/Release/

  macos:
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter create --platforms=macos,ios .
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-macos-build
          path: build/macos/Build/Products/Release/
      - run: flutter build ios --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-ios-build
          path: build/ios/iphoneos/
