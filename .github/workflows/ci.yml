name: SBILL CI
# Final production validation workflow for every main commit.
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: sbill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format .
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter create --platforms=android,windows,macos .
      - run: dart run launcher_icons
      - name: Check cloud build configuration
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase account/sync configuration: enabled"
          else
            echo "Supabase account/sync configuration: disabled for this build (repository variables are not set)."
          fi
      - run: flutter build apk --debug --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Verify Android APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -s "$APK"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: test -s website/index.html
      - run: test -s website/styles.css

  windows:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter create --platforms=windows .
      - run: dart run launcher_icons
      - run: flutter build windows --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sbill-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-windows-package
          path: sbill-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-windows-build
          path: build/windows/x64/runner/Release/

  macos:
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter create --platforms=macos,ios .
      - run: dart run launcher_icons
      - run: flutter build macos --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-macos-build
          path: build/macos/Build/Products/Release/
      - name: Package macOS app
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/sbill.app" sbill-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-macos-package
          path: sbill-macos.zip
      - run: flutter build ios --no-codesign --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-ios-build
          path: build/ios/iphoneos/
      - name: Package iOS unsigned app
        shell: bash
        run: |
          IOS_APP=$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$IOS_APP"
          ditto -c -k --sequesterRsrc --keepParent "$IOS_APP" sbill-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sbill-ios-package
          path: sbill-ios-unsigned.zip
