name: shop_inventory_app
description: Offline-first shop inventory, billing and business management app for small retail businesses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.2.5
  path_provider: ^2.10.0
  shared_preferences: ^2.3.1
  uuid: ^4.5.1
  permission_handler: ^11.1.0
  mobile_scanner: ^5.2.3
  pdf: ^3.6.0
  printing: ^5.13.0
  share_plus: ^10.0.2
  open_filex: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
