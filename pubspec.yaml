name: sbill
description: SBILL — Simple Billing. Smarter Business.
publish_to: 'none'
version: 1.2.0+3
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  supabase_flutter: ^2.6.0
  pdf: ^3.11.1
  printing: ^5.13.4
  window_manager: ^0.4.3
  shared_preferences: ^2.3.2
  file_picker: ^11.0.3
  cross_file: ^0.3.4+2
  share_plus: ^11.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
  image_path: "assets/icon/sbill_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

