<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SBILL support center."><title>Support — SBILL</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="nav"><a class="brand" href="index.html"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 1024 1024"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><rect x="32" y="32" width="960" height="960" rx="220" fill="url(#g)"/><path d="M710 285c-70-73-184-105-303-78-121 27-194 96-194 188 0 106 74 151 205 187 134 36 199 60 199 121 0 60-61 101-154 101-83 0-150-29-207-89" fill="none" stroke="#fff" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>SBILL</span></a><nav><a href="index.html">Home</a><a href="account.html">Account</a><a href="founder.html">Founder</a></nav></header>
<main class="section portal-page"><div class="portal-card">
<p class="eyebrow">SUPPORT CENTER</p><h1 class="portal-title">Get help with SBILL.</h1>
<p class="large">Support requests are tied to your SBILL account, so the same request history is available in the app and on this website.</p>
<div id="notice" class="portal-state">Loading support…</div>
<form id="ticketForm" class="portal-form hidden">
<label>Category<select id="category"><option>General</option><option>Bug</option><option>Billing</option><option>Sync</option><option>Feature</option></select></label>
<label>Subject<input id="subject" required minlength="3"></label>
<label>Message<textarea id="message" rows="6" required minlength="5"></textarea></label>
<button class="primary" type="submit">Send support request</button>
</form>
<div id="tickets"></div>
</div></main>
<footer><b>SBILL</b> · Support · <a href="account.html">Account</a></footer>
<script type="module">
import {getSupabase,listTickets,createTicket} from './web-auth.js';
const notice=document.getElementById('notice'), form=document.getElementById('ticketForm'), tickets=document.getElementById('tickets');
async function render(){
 const supabase=await getSupabase(); if(!supabase){notice.textContent='Cloud account is not configured on this website yet.';return;}
 const {data:{user}}=await supabase.auth.getUser();
 if(!user){notice.textContent='Sign in to your SBILL account to create and track support requests.';return;}
 form.classList.remove('hidden'); notice.textContent='Signed in as '+(user.email||'SBILL account')+'.';
 const rows=await listTickets(); tickets.innerHTML='';
 if(!rows.length){tickets.innerHTML='<div class="portal-state">No support requests yet.</div>';return;}
 for(const t of rows){
  const el=document.createElement('article'); el.className='ticket';
  const reply=t.admin_reply?('<div class="ticket-reply"><b>Support reply</b><p>'+escapeHtml(t.admin_reply)+'</p></div>'):'';
  el.innerHTML='<div class="ticket-head"><b>'+escapeHtml(t.subject)+'</b><span>'+escapeHtml(t.status)+'</span></div><p>'+escapeHtml(t.message)+'</p>'+reply;
  tickets.appendChild(el);
 }
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
form.addEventListener('submit',async e=>{
 e.preventDefault(); try{await createTicket({category:document.getElementById('category').value,subject:document.getElementById('subject').value.trim(),message:document.getElementById('message').value.trim(),priority:'normal'});form.reset();notice.textContent='Support request submitted.';await render();}catch(err){notice.textContent=err.message||String(err);}
});
render();
</script>
</body></html>
